aid: roadsync
name: Roadsync
description: >-
  RoadSync is a digital payments and expense-management platform for the logistics and trucking
  industry, enabling warehouses, repair and tow shops, brokers, and carriers to accept and disburse
  payments faster. RoadSync publishes a REST API surface across six services: the RoadSyncPay Public
  API (payees, funding sources, payables, transactions, brokers, loads for ACH/paper-check/RTP carrier
  disbursements), the Invoice API (create, send, void, clone, refund, and embed invoices), the Company
  API (locations and product catalog), the WorkOrders API (create, send, approve work orders), a
  Payment API for taking payments, and a legacy Client API. All APIs are HTTPS REST, authenticated with
  an x-api-key header, versioned in the URI path, and split into test and production hosts.
